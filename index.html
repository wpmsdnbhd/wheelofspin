<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wheel Spinner</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #f5f0e1, #e8dcd5);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* HEADER */
.page-header {
  position: fixed;
  top: 40px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 40px;
  color: #6E7F4B;
  z-index: 1000;
}

/* LAYOUT */
.container {
  display: flex;
  gap: 40px;
  align-items: center;
}

/* WHEEL */
#wheelWrapper {
  position: relative;
}

canvas {
  background: transparent;
}

#spinBtn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: none;
  background: #6E7F4B;
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 6px 15px rgba(0,0,0,.25);
}

/* SETTINGS PANEL */
.panel {
  background: white;
  padding: 14px;
  border-radius: 14px;
  width: 200px;
  box-shadow: 0 8px 20px rgba(0,0,0,.12);
}

.panel h3 {
  margin: 0 0 10px;
  text-align: center;
}

.panel input {
  width: 90%;
  display: block;
  margin: 8px auto;
  padding: 7px 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

/* POPUP */
#popup {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.popupBox {
  background: white;
  padding: 20px;
  border-radius: 16px;
  width: 320px;
  max-height: 70vh;
  overflow-y: auto;
}

.popupBox button {
  width: 100%;
  margin-top: 12px;
  padding: 8px;
  border-radius: 8px;
  border: none;
  background: #6E7F4B;
  color: white;
  cursor: pointer;
}

/* HISTORY BUTTON */
#historyBtn {
  position: fixed;
  top: 30px;
  right: 30px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: #6E7F4B;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

/* HISTORY PANEL */
#historyPanel {
  display: none;
  position: fixed;
  top: 90px;
  right: 30px;
  width: 240px;
  max-height: 300px;
  background: white;
  padding: 12px;
  border-radius: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,.25);
  overflow-y: auto;
}

#historyPanel h3 {
  margin: 0 0 8px;
  text-align: center;
}

#historyList {
  padding-left: 18px;
  margin: 0;
  font-size: 14px;
  word-break: break-word;
}

#exportBtn {
  margin-top: 8px;
  width: 100%;
  padding: 6px;
  border-radius: 8px;
  border: none;
  background: #6E7F4B;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<h1 class="page-header">🎡 Spin the Wheel - MIRAI</h1>

<div class="container">

  <div id="wheelWrapper">
    <canvas id="wheel" width="600" height="600"></canvas>
    <button id="spinBtn">SPIN</button>
  </div>

  <div class="panel">
    <h3>Settings</h3>
    <input type="file" id="fileInput" accept=".xlsx,.xls">
    <input type="number" id="winnerCount" placeholder="Total winners">
  </div>

</div>

<!-- POPUP -->
<div id="popup">
  <div class="popupBox">
    <h2>🎉 Winners 🎉</h2>
    <ol id="winnerList"></ol>
    <button onclick="popup.style.display='none'">Close</button>
  </div>
</div>

<!-- HISTORY -->
<button id="historyBtn">🏆</button>
<div id="historyPanel">
  <h3>🏆 Winners History</h3>
  <ol id="historyList"></ol>
  <button id="exportBtn">Export to Excel</button>
</div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const colors = ["#8F3E3E","#6E7F4B","#7C8A96","#C89B6A"];

let allNames = [], remainingNames = [], displayNames = [], angle = 0;
let winnersHistory = [];

/* LOAD EXCEL */
fileInput.onchange = e => {
  const reader = new FileReader();
  reader.onload = evt => {
    const wb = XLSX.read(evt.target.result, { type: "binary" });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    allNames = XLSX.utils.sheet_to_json(sheet, { header: 1 }).flat().filter(Boolean);
    remainingNames = [...allNames];
    updateWheel();
  };
  reader.readAsBinaryString(e.target.files[0]);
};

/* SHUFFLE */
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* UPDATE DISPLAY NAMES */
function updateWheel(){
  displayNames = shuffle([...remainingNames]).slice(0,36);
  drawWheel(angle);
}

/* DRAW WHEEL */
function drawWheel(rot=angle){
  ctx.clearRect(0,0,600,600);
  ctx.save();
  ctx.translate(300,300);
  ctx.rotate(rot);
  const arc = 2*Math.PI/displayNames.length;
  displayNames.forEach((n,i)=>{
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.fillStyle = colors[i%colors.length];
    ctx.arc(0,0,290,i*arc,(i+1)*arc);
    ctx.fill();

    ctx.save();
    ctx.rotate(i*arc+arc/2);
    ctx.textAlign="right";
    ctx.fillStyle="#fff";
    ctx.font="18px Poppins";
    ctx.fillText(n,260,6);
    ctx.restore();
  });
  ctx.restore();
}

/* SPIN WITH SUSPENSE */
spinBtn.onclick = () => {
  if(!remainingNames.length) return;
  const count = Math.min(+winnerCount.value, remainingNames.length);
  const winners = [];

  let spins = Math.random()*8 + 8; // 8-16 spins
  let totalRotation = spins * 2 * Math.PI;
  let start = null;
  const duration = 3500;

  function animate(t){
    if(!start) start = t;
    let progress = Math.min((t-start)/duration,1);
    angle = totalRotation*(1 - Math.pow(1-progress,3));
    drawWheel(angle);

    if(progress<1){
      requestAnimationFrame(animate);
    } else {
      for(let i=0;i<count;i++){
        winners.push(remainingNames.splice(Math.floor(Math.random()*remainingNames.length),1)[0]);
      }
      winnerList.innerHTML = winners.map(w=>`<li>${w}</li>`).join("");
      popup.style.display = "flex";
      confetti({particleCount:200,spread:80});
      winnersHistory.push(...winners);
      updateHistory();
      updateWheel();
    }
  }
  requestAnimationFrame(animate);
};

/* HISTORY */
function updateHistory(){
  historyList.innerHTML = winnersHistory.map(w=>`<li>${w}</li>`).join("");
}

historyBtn.onclick = ()=>{
  historyPanel.style.display = historyPanel.style.display==="block"?"none":"block";
};

/* EXPORT TO EXCEL */
exportBtn.onclick = ()=>{
  if(!winnersHistory.length) return alert("No winners to export!");
  const ws = XLSX.utils.aoa_to_sheet([["Winner Name"], ...winnersHistory.map(w=>[w])]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Winners");
  XLSX.writeFile(wb, "winners_history.xlsx");
};
</script>

</body>
</html>
